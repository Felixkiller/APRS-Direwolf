# Direwolf - IGate YD3ADB-11 -> aprs.fi
# Jalankan dari folder ini:   direwolf.exe -c direwolf.conf -t 0

# ---- Audio -------------------------------------------------------------
# Sesuaikan dengan perangkat audio/radio yang dipakai di lab.
# Lihat daftar perangkat: jalankan `direwolf.exe` tanpa argumen.
ADEVICE  0 0
CHANNEL  0
MYCALL   YD3ADB-11
MODEM    1200

# Hanya perlu jika radio memakai PTT lewat serial/CM108, hapus tanda # dan sesuaikan:
# PTT COM3 RTS

# ---- IGate ke APRS-IS (aprs.fi membaca dari sini) -----------------------
IGSERVER rotate.aprs2.net
IGLOGIN  YD3ADB-11 23973
# Hanya teruskan RF -> internet. Tanpa IGTXVIA/IGFILTER, Direwolf tidak
# memancarkan balik paket internet ke RF.

# ---- Beacon posisi IGate (supaya YD3ADB-11 muncul di aprs.fi) ----------
# GANTI lat/long dengan lokasi sebenarnya (format derajat^menit.hundredth).
PBEACON sendto=IG delay=1 every=10 symbol="igate" overlay=R lat=7^13.74S long=112^44.88E comment="Direwolf IGate YD3ADB-11"

# ---- Beacon suhu dari MQTT ---------------------------------------------
# aprs_bridge.py (mode default) menulis latest_aprs_info.txt tiap ada pesan MQTT.
# INFOCMD mengambil isinya; kalau data lebih tua dari 180 detik, tidak dikirim.
# Untuk demo boleh every=2; setelah demo kembalikan ke >=5 agar tidak membebani APRS-IS.
CBEACON sendto=IG delay=2 every=30 infocmd="C:\Users\Felix\Downloads\APRS direwolf\.venv\Scripts\python.exe C:\Users\Felix\Downloads\APRS direwolf\aprs_bridge.py --print-latest --max-age 180"

# ---- Port untuk klien lain ---------------------------------------------
AGWPORT  8000
KISSPORT 8001
